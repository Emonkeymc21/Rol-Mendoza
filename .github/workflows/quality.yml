name: Cumbre20 quality gates
on:
  pull_request:
  push:
    branches: [main, codex/cumbre20-phase-4-1]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ls --all
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm run build:prod
      - run: npm run test:unit
      - run: npm run test:ci
      - run: npm run test:emulators
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:e2e -- --project=desktop-${{ matrix.engine }} --project=${{ matrix.engine == 'chromium' && 'android-chromium' || 'iphone-webkit' }}
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
