name: Cumbre20 quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ls --all
      - run: npm audit
      - run: npm audit --omit=dev
      - run: npm run build:prod
      - run: npm run test:production-csp
      - run: npm run test:unit
      - run: npm run test:ci
      - run: npm run test:emulators
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
  browsers:
    runs-on: ${{ matrix.engine == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:e2e:production -- --project=desktop-${{ matrix.engine }} --project=${{ matrix.engine == 'chromium' && 'android-chromium' || 'iphone-webkit' }}
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
          CUMBRE20_SSR_E2E: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: browser-evidence-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-audit-baseline.cjs
      - run: npm run audit:browser
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
          CUMBRE20_AUDIT_LABEL: baseline
          CUMBRE20_AUDIT_ROOT: dist/audit-baseline
      - run: npm run audit:build
      - run: npm run audit:browser
        env:
          FIREBASE_CLI_DISABLE_MOTD: 'true'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: performance-accessibility-visual
          path: audit-results/
          retention-days: 14
