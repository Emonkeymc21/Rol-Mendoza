<section class="page-intro"><div class="page-shell"><div><span class="eyebrow">Actividad</span><h1 class="section-title mt-3">Notificaciones</h1><p>Solicitudes y novedades importantes de tus mesas.</p></div><button *ngIf="unreadCount" type="button" class="btn-secondary" (click)="markAll()" [disabled]="markingAll">{{ markingAll ? 'Marcando…' : 'Marcar todas como leídas' }}</button></div></section>
<section class="section-space"><div class="page-shell max-w-4xl"><div *ngIf="loading" class="loading-panel">Cargando notificaciones…</div><p *ngIf="errorMessage" class="feedback-error" role="alert">{{ errorMessage }}</p><div *ngIf="!loading && notifications.length" class="notification-list"><button *ngFor="let item of notifications; trackBy: trackNotification" type="button" class="notification-card" [class.unread]="!item.read" (click)="open(item)"><app-class-avatar [avatarClass]="actorProfiles[item.actorUid]?.avatarClass || 'FIGHTER'" size="sm"></app-class-avatar><span class="min-w-0 flex-1"><span class="notification-top"><strong>{{ item.title }}</strong><time>{{ item.createdAt | date:'d/M, HH:mm' }}</time></span><span class="notification-message">{{ item.message }}</span></span><app-icon name="arrow" [size]="17"></app-icon></button></div><div *ngIf="!loading && !notifications.length" class="empty-state"><app-icon name="bell" [size]="28"></app-icon><h2>Todo al día</h2><p>Cuando haya novedades sobre tus partidas o solicitudes, van a aparecer acá.</p></div></div></section>
