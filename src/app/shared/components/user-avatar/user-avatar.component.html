<span class="user-avatar" [class]="'user-avatar user-avatar--' + size" [attr.aria-label]="name">
  <img *ngIf="photoURL; else rpgAvatar" [src]="photoURL" [alt]="'Avatar de ' + name" referrerpolicy="no-referrer">
  <ng-template #rpgAvatar>
    <svg viewBox="0 0 64 64" role="img" [attr.aria-label]="'Avatar ' + avatarType">
      <defs><linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9f3442"/><stop offset="1" stop-color="#39161d"/></linearGradient></defs>
      <circle cx="32" cy="32" r="31" fill="url(#avatar-bg)"/>
      <path *ngIf="avatarType === 'ELF'" d="M18 29 7 20l9 19m30-10 11-9-9 19M21 23c3-11 19-11 22 0l-2 20c-4 9-14 9-18 0Z"/>
      <path *ngIf="avatarType === 'DWARF'" d="M20 21c4-9 20-9 24 0l-2 13 6 3-6 17-10-6-10 6-6-17 6-3Zm2 12h20M25 41l7 7 7-7"/>
      <path *ngIf="avatarType === 'WARRIOR'" d="m15 22 17-11 17 11-4 23-13 10-13-10Zm5 5h24M32 12v34m-8-10 8 10 8-10"/>
      <path *ngIf="avatarType === 'DRUID'" d="M32 13c-10 0-17 9-15 20 2 13 9 21 15 21s13-8 15-21c2-11-5-20-15-20Zm0 4v34M18 24 9 17m37 7 9-7M23 33c4-4 14-4 18 0"/>
      <path *ngIf="avatarType === 'RANGER'" d="M11 42 32 10l21 32-12-3-9 16-9-16Zm12-3h18M17 46l-5 9m35-9 5 9"/>
      <path *ngIf="avatarType === 'WIZARD'" d="M10 41 32 8l22 33-13-3 5 16H18l5-16Zm14-6h16M28 45h8"/>
      <circle *ngIf="avatarType !== 'WARRIOR'" cx="26" cy="31" r="1.7"/><circle *ngIf="avatarType !== 'WARRIOR'" cx="38" cy="31" r="1.7"/>
    </svg>
  </ng-template>
</span>
