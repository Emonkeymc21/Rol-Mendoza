<span class="class-avatar" [class]="'class-avatar class-avatar--' + size" role="img" [attr.aria-label]="'Emblema: ' + label" [title]="label">
  <svg viewBox="0 0 80 80" aria-hidden="true" focusable="false">
    <circle class="emblem-ring" cx="40" cy="40" r="37" />
    <path class="emblem-shield" d="M40 9 65 18v20c0 16-10 27-25 34C25 65 15 54 15 38V18Z" />
    <g [ngSwitch]="resolvedClass" class="emblem-glyph">
      <!-- Hacha doble: Bárbaro -->
      <g *ngSwitchCase="'BARBARIAN'"><path d="M40 24v36M35 28h10M36 57h8"/><path class="glyph-fill" d="M38 29c-7-10-16-9-20-2 5 0 8 4 9 10 4-1 8-3 11-8Zm4 0c7-10 16-9 20-2-5 0-8 4-9 10-4-1-8-3-11-8Z"/></g>
      <!-- Laúd: Bardo -->
      <g *ngSwitchCase="'BARD'"><path d="m45 20-7 25M43 23l9 3M38 43c-8-4-17 1-16 9 1 7 10 10 16 5 5-4 5-10 0-14Z"/><circle class="glyph-fill" cx="32" cy="51" r="3"/><path d="M29 48h7"/></g>
      <!-- Sol y maza: Clérigo -->
      <g *ngSwitchCase="'CLERIC'"><circle cx="40" cy="33" r="8"/><path d="M40 18v7m0 16v7M25 33h7m16 0h7M29 22l5 5m12 12 5 5m0-22-5 5M34 39l-5 5M40 48v13"/><path class="glyph-fill" d="m40 27 3 6-3 6-3-6Z"/></g>
      <!-- Yelmo: Paladín -->
      <g *ngSwitchCase="'PALADIN'"><path d="M25 31c2-12 28-12 30 0l-3 24-12 7-12-7Z"/><path d="M25 34h30M40 25v36M30 41l10 5 10-5"/><path class="glyph-fill" d="m22 22 9 4-6 6Zm36 0-9 4 6 6Z"/></g>
      <!-- Arco y flecha: Explorador -->
      <g *ngSwitchCase="'RANGER'"><path d="M23 19c21 10 21 32 0 42M23 19c-9 13-9 29 0 42M23 40h34M50 34l7 6-7 6"/><path class="glyph-fill" d="m21 36 8 4-8 4Z"/></g>
      <!-- Daga: Pícaro -->
      <g *ngSwitchCase="'ROGUE'"><path d="m48 19-6 31-5 8-3-9 6-31Z"/><path d="m30 46 17 4M32 42l-2 4 3 5M37 58l-1 5"/><path class="glyph-fill" d="m40 18 5-4 4 7Z"/></g>
      <!-- Luna y hoja: Druida -->
      <g *ngSwitchCase="'DRUID'"><path d="M44 20c-12 2-17 18-8 26 5 5 12 4 17 0-10 2-16-9-9-26Z"/><path d="M25 60c1-12 9-18 22-17-2 12-10 18-22 17Zm2-2 16-12"/><circle class="glyph-fill" cx="24" cy="31" r="3"/></g>
      <!-- Escudo y armas: Guerrero -->
      <g *ngSwitchCase="'FIGHTER'"><path d="m22 22 36 38M58 22 22 60M20 19l8 1-7 7m39-8-8 1 7 7"/><path class="glyph-fill" d="M40 25 53 31v12c0 9-5 15-13 20-8-5-13-11-13-20V31Z"/><path class="glyph-cut" d="M40 31v24m-7-15h14"/></g>
      <!-- Puño: Monje -->
      <g *ngSwitchCase="'MONK'"><path class="glyph-fill" d="M25 38V26c0-4 6-4 6 0v8-12c0-4 6-4 6 0v12-14c0-4 6-4 6 0v14-11c0-4 6-4 6 0v17l5-6c3-3 7 1 5 4L49 57c-3 5-7 7-13 6-8-1-13-6-14-14l-1-8c0-4 4-5 6-2l4 7"/></g>
      <!-- Llama: Hechicero -->
      <g *ngSwitchCase="'SORCERER'"><path class="glyph-fill" d="M42 17c4 13-5 14 2 23 2-7 7-9 7-16 9 12 10 22 5 30-7 12-25 13-32 1-7-12 1-22 9-31-1 10 4 12 5 18 5-7-1-14 4-25Z"/><path class="glyph-cut" d="M41 43c6 7 3 16-3 17-7-2-7-11 3-17Z"/></g>
      <!-- Ojo arcano: Brujo -->
      <g *ngSwitchCase="'WARLOCK'"><path d="M19 40c11-15 31-15 42 0-11 15-31 15-42 0Z"/><circle cx="40" cy="40" r="7"/><circle class="glyph-fill" cx="40" cy="40" r="3"/><path d="M40 17v7m0 32v7M24 24l5 5m22 22 5 5m0-32-5 5M29 51l-5 5"/></g>
      <!-- Sombrero y chispa: Mago -->
      <g *ngSwitchCase="'WIZARD'"><path class="glyph-fill" d="m41 17 16 36-15-4-20 8 12-19Z"/><path d="M19 57h43M35 37l9 12M48 21l2-6m5 11 6-2m-9 10 5 4"/><circle class="glyph-cut" cx="38" cy="42" r="2"/></g>
      <!-- d20 neutral -->
      <g *ngSwitchDefault><path d="m40 18 23 17-9 27H26l-9-27Z"/><path d="m17 35 23 7 23-7M26 62l14-20 14 20M40 18v24"/><text x="40" y="38" text-anchor="middle">20</text></g>
    </g>
  </svg>
</span>
