<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <title>Cumbre20 | Encontrá tu próxima mesa</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cumbre20 conecta jugadores, Dungeon Masters y partidas de rol en Mendoza. Encontrá tu próxima mesa.">
  <meta property="og:title" content="Cumbre20 | Encontrá tu próxima mesa">
  <meta property="og:description" content="La comunidad rolera de Mendoza.">
  <meta name="theme-color" content="#130e10">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('cumbre20-theme'); } catch (error) { saved = null; }
      var preference = saved === 'light' || saved === 'dark' ? saved : 'system';
      var resolved = preference === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.dataset.themePreference = preference;
    }());
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/cumbre20-logo.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
